name: Deploy WASM playground to Pages

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "differential_equations/chapters/**"
      - "differential_equations/delib/**"
      - "web/**"
      - "scripts/build_wasm_site.py"
      - "manim/**"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow the deployment to read the repo and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Supersede an in-flight run for the same ref. Scoped per-ref so a feature
# branch's build can't cancel main's live deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Render the Manim hero derivations (manim/*.py) to mp4s. The heavy LaTeX
  # install + render only runs when manim/** changes (keyed cache); otherwise the
  # cached videos are reused. Failure-tolerant: if a render breaks, the build
  # still proceeds and the chapter shows delib.video's fallback note instead.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure output dir
        run: mkdir -p assets-rendered

      - name: Cache rendered media
        id: cache
        uses: actions/cache@v4
        with:
          path: assets-rendered
          key: manim-${{ hashFiles('manim/**') }}

      - name: Install Manim + system deps
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev \
            texlive texlive-latex-extra texlive-fonts-extra dvisvgm
          python -m pip install --upgrade pip
          pip install manim

      - name: Render scenes
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          # Add a line per hero scene as chapters grow.
          manim render -qm -o newton_cooling manim/newton_cooling.py SceneNewtonCoolingFull || true
          find media -name 'newton_cooling.mp4' -exec cp {} assets-rendered/ \; || true
          manim render -qm -o cooling_linear_method manim/cooling_linear_method.py SceneCoolingLinearMethod || true
          find media -name 'cooling_linear_method.mp4' -exec cp {} assets-rendered/ \; || true
          manim render -qm -o f_recovery manim/f_recovery.py SceneFRecovery || true
          find media -name 'f_recovery.mp4' -exec cp {} assets-rendered/ \; || true
          manim render -qm -o integrating_factor manim/integrating_factor.py SceneIntegratingFactor || true
          find media -name 'integrating_factor.mp4' -exec cp {} assets-rendered/ \; || true
          manim render -qm -o bernoulli_substitution manim/bernoulli_substitution.py SceneBernoulliSubstitution || true
          find media -name 'bernoulli_substitution.mp4' -exec cp {} assets-rendered/ \; || true
          manim render -qm -o euler_walks_field manim/euler_walks_field.py SceneEulerWalksField || true
          find media -name 'euler_walks_field.mp4' -exec cp {} assets-rendered/ \; || true
          manim render -qm -o heun_step manim/heun_step.py SceneHeunStep || true
          find media -name 'heun_step.mp4' -exec cp {} assets-rendered/ \; || true
          manim render -qm -o phase_line_collapse manim/phase_line_collapse.py ScenePhaseLineCollapse || true
          find media -name 'phase_line_collapse.mp4' -exec cp {} assets-rendered/ \; || true
          manim render -qm -o characteristic_equation manim/characteristic_equation.py SceneCharacteristicEquation || true
          find media -name 'characteristic_equation.mp4' -exec cp {} assets-rendered/ \; || true
          ls -la assets-rendered || true

      - name: Upload rendered media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-media
          path: assets-rendered
          if-no-files-found: ignore

  build:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rendered media
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rendered-media
          path: assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build interactive WASM site
        run: python scripts/build_wasm_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # main is production. The active integration branch also deploys so it can be
  # previewed live; other feature branches still build as a CI check but don't
  # deploy, so they can't clobber the live site.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/tender-einstein-arCIU'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
