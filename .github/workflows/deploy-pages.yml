name: Deploy WASM playground to Pages

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "differential_equations/chapters/**"
      - "differential_equations/delib/**"
      - "web/**"
      - "scripts/build_wasm_site.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow the deployment to read the repo and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Supersede an in-flight run for the same ref. Scoped per-ref so a feature
# branch's build can't cancel main's live deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build interactive WASM site
        run: python scripts/build_wasm_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Only main publishes to the live site. On other branches the build above
  # still runs as a CI check, but the deploy is skipped (not failed) — the
  # github-pages environment also only permits the default branch to deploy.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
